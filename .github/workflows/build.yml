name: Build Kitsune APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options:
          - release
          - debug
        default: release
      publish:
        description: "Publish as a GitHub release? nightly = rolling pre-release of a release build, beta = rolling pre-release of a debug build (both updated in place), release = normal versioned release"
        type: choice
        options:
          - none
          - nightly
          - beta
          - release
        default: none
      version:
        description: "Version name for a normal release, e.g. 1.2.0 (tag becomes v1.2.0). Empty = date + commit"
        type: string
        required: false

concurrency:
  group: build-${{ github.ref }}-${{ inputs.build_type }}-${{ inputs.publish }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ inputs.build_type }} APK (publish ${{ inputs.publish }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Validate inputs
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          if { [ "$PUBLISH" = "nightly" ] || [ "$PUBLISH" = "release" ]; } && [ "$BUILD_TYPE" != "release" ]; then
            echo "::error::publish=$PUBLISH needs build_type=release (got $BUILD_TYPE)"
            exit 1
          fi
          if [ "$PUBLISH" = "beta" ] && [ "$BUILD_TYPE" != "debug" ]; then
            echo "::error::publish=beta needs build_type=debug (got $BUILD_TYPE)"
            exit 1
          fi

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: true

      - name: Compute version
        id: ver
        env:
          PUBLISH: ${{ inputs.publish }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          SHORT=$(git rev-parse --short=8 HEAD)
          if [ "$PUBLISH" = "nightly" ] || [ "$PUBLISH" = "beta" ]; then
            VERSION="$PUBLISH-$SHORT"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="$(date -u +%Y%m%d)-$SHORT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"

      # The native daemon embeds the signing certificate at build time, so the key
      # has to be available before the native code is compiled.
      - name: Prepare config and signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_TYPE: ${{ inputs.build_type }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          echo "version=$VERSION" > config.prop

          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::warning::Repository secret $v is not set"
              missing=1
            fi
          done

          if [ "$missing" = "1" ]; then
            if [ "$BUILD_TYPE" = "release" ]; then
              echo "::error::A release build needs all four signing secrets"
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Debug build without signing secrets: the default debug key will be used"
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "keyStore=$RUNNER_TEMP/release.jks"
            echo "keyStorePass=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPass=$KEY_PASSWORD"
          } >> config.prop
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build native binaries
        env:
          FLAGS: ${{ inputs.build_type == 'release' && '-vr' || '-v' }}
        run: ./build.py $FLAGS native

      - name: Build APK
        env:
          FLAGS: ${{ inputs.build_type == 'release' && '-vr' || '-v' }}
        run: ./build.py $FLAGS app

      - name: Locate APK
        id: apk
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          APK="out/app-${BUILD_TYPE}.apk"
          test -f "$APK" || { echo "::error::$APK was not produced"; ls -la out; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Stop gradle daemon
        if: always()
        run: ./app/gradlew --stop || true

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" config.prop

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: kitsune-${{ inputs.build_type }}-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # Rolling pre-releases: "nightly" (release build) and "beta" (debug build). The tag,
      # title, notes and APK are updated in place, no new release is created after the first run.
      - name: Publish rolling pre-release (nightly / beta)
        if: inputs.publish == 'nightly' || inputs.publish == 'beta'
        env:
          CHANNEL: ${{ inputs.publish }}
          BUILD_TYPE: ${{ inputs.build_type }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SHORT: ${{ steps.ver.outputs.short }}
          VERSION: ${{ steps.ver.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          ASSET="Kitsune-$CHANNEL.apk"
          cp "$APK" "$ASSET"
          CAP="$(echo "${CHANNEL:0:1}" | tr a-z A-Z)${CHANNEL:1}"
          TITLE="$CAP ($SHORT)"
          if [ "$SIGNED" = "true" ]; then SIGN_TXT="signed with the project key"; else SIGN_TXT="signed with the default debug key"; fi
          {
            echo "Automated $CHANNEL build. This release is updated in place on every $CHANNEL run."
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Commit: [\`$SHORT\`](https://github.com/$REPO/commit/$SHA)"
            echo "- Built: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- Build type: $BUILD_TYPE ($SIGN_TXT)"
            if [ "$CHANNEL" = "beta" ]; then
              echo
              echo "> Debug build for testing: it is slower, unminified and may be unstable."
            fi
            echo
            echo "### Recent changes"
            git log -n 15 --no-merges --pretty='- %s (%h)'
          } > rolling-notes.md

          if gh release view "$CHANNEL" >/dev/null 2>&1; then
            # move the tag to this commit
            gh api -X PATCH "repos/$REPO/git/refs/tags/$CHANNEL" -f sha="$SHA" -F force=true >/dev/null \
              || gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$CHANNEL" -f sha="$SHA" >/dev/null
            gh release edit "$CHANNEL" --title "$TITLE" --notes-file rolling-notes.md --prerelease
            for a in $(gh release view "$CHANNEL" --json assets -q '.assets[].name'); do
              gh release delete-asset "$CHANNEL" "$a" --yes
            done
            gh release upload "$CHANNEL" "$ASSET" --clobber
          else
            gh release create "$CHANNEL" "$ASSET" --target "$SHA" --title "$TITLE" \
              --notes-file rolling-notes.md --prerelease
          fi

      # Normal release: tag v<version>. Re-running with the same version updates that
      # release instead of creating a duplicate.
      - name: Publish release
        if: inputs.publish == 'release'
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.ver.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          TAG="v$VERSION"
          ASSET="Kitsune-$TAG.apk"
          cp "$APK" "$ASSET"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$SHA" --title "Kitsune $VERSION" \
              --generate-notes
          fi
