name: Build Kitsune APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options:
          - release
          - debug
        default: release

concurrency:
  group: build-${{ github.ref }}-${{ inputs.build_type }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.build_type }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          is-asset-build: true

      # Signing key (release builds require it, debug builds use it when it is set).
      # The native daemon embeds the signing certificate at build time, so the key
      # has to be available before the native code is compiled.
      - name: Prepare signing config
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          missing=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::warning::Repository secret $v is not set"
              missing=1
            fi
          done

          if [ "$missing" = "1" ]; then
            if [ "$BUILD_TYPE" = "release" ]; then
              echo "::error::A release build needs all four signing secrets"
              exit 1
            fi
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Debug build without signing secrets: the default debug key will be used"
            exit 0
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "keyStore=$RUNNER_TEMP/release.jks"
            echo "keyStorePass=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPass=$KEY_PASSWORD"
          } > config.prop
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build native binaries
        env:
          FLAGS: ${{ inputs.build_type == 'release' && '-vr' || '-v' }}
        run: ./build.py $FLAGS native

      - name: Build APK
        env:
          FLAGS: ${{ inputs.build_type == 'release' && '-vr' || '-v' }}
        run: ./build.py $FLAGS app

      - name: Locate APK
        id: apk
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          APK="out/app-${BUILD_TYPE}.apk"
          test -f "$APK" || { echo "::error::$APK was not produced"; ls -la out; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Stop gradle daemon
        if: always()
        run: ./app/gradlew --stop || true

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" config.prop

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: kitsune-${{ inputs.build_type }}-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
